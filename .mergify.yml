pull_request_rules:
  - name: p31 template probe
    conditions:
      - base=main
      - label=p31-tpl
    actions:
      comment:
        message: "TPL author={{author}} body={{body}} files={{files}} commits={{commits}} assignee={{assignee}} approvers={{approvers}} queue_dequeue_reason={{queue_dequeue_reason}} head={{head}} labels={{labels}}"
